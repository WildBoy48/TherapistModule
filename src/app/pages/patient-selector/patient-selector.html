<div class="container-fluid px-0">
  <div class="row mb-3 align-items-center">
    <div class="col">
      <h2 class="mb-0">Patients</h2>
    </div>
    <div class="col-auto">
      <button type="button" class="btn btn-primary">Add Patient</button>
    </div>
  </div>

  @if (isLoading) {
    <div class="loading">
      <p>Loading patients...</p>
    </div>
  }

  @if (error) {
    <div class="error">
      <p>{{ error }}</p>
    </div>
  }

  @if (!isLoading && !error && patients.length > 0) {
    <div class="row g-4">
      @for (patient of patients; track patient.id) {
        <div class="col-4 col-lg-3">
          <app-patient-card [patient]="patient" [isSelectable]="true"></app-patient-card>
        </div>
      }
    </div>
  }
</div>
