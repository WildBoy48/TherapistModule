<div class="container">
    <h2 class="mb-4">Session Configuration</h2>
    <div class="row mb-3">
        @if (selectedMiniGame) {
            <div class="col">
                <app-mini-game-card [game]="selectedMiniGame"></app-mini-game-card>
                <div class="button-group mt-3">
                    <button type="button" class="btn btn-danger me-2" (click)="deselectMiniGame()">Deselect</button>
                    <button type="button" class="btn btn-warning" (click)="changeMiniGame()">Change Mini-Game</button>
                </div>
            </div>
        } @else {
            <p class="col">No mini-game selected...</p>
            <button type="button" class="btn btn-primary col" routerLink="/mini-game-selector">Mini-Game List</button>
        }
    </div>
    <div class="row mb-3">
        <p class="col">No patient selected...</p>
        <button type="button" class="btn btn-primary col" routerLink="/patient-selector">Patient List</button>
    </div>
</div>
