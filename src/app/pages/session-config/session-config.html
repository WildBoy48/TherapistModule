<div class="container-fluid session-config px-0">
    <div class="row mb-3">
        <div class="col-12">
            <h2 class="mb-0">Session Configuration</h2>
        </div>
    </div>

    <div class="row g-4 session-body">
        <div class="col-12 col-lg-4 col-xl-3">
            <div class="mini-game-column h-100">
                <div class="mini-game-panel h-100">
                    @if (selectedMiniGame) {
                            <button type="button" class="btn btn-warning" (click)="changeMiniGame()">Change</button>
                    }
                    @if (selectedMiniGame) {
                        <article class="selected-game-card">
                            <img [src]="selectedMiniGame.image" [alt]="selectedMiniGame.name" class="selected-game-image">
                            <div class="selected-game-content">
                                <p class="game-id">Game #{{ selectedMiniGame.id }}</p>
                                <h4>{{ selectedMiniGame.name }}</h4>
                                <p class="target-group">{{ selectedMiniGame.targetGroup }}</p>
                                <p class="description">{{ selectedMiniGame.description }}</p>
                            </div>
                        </article>
                    } @else {
                        <button type="button" class="empty-game-card" (click)="changeMiniGame()">
                            <h4>No mini-game selected</h4>
                            <p>Click here to choose the mini-game</p>
                        </button>
                    }
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8 col-xl-9">
            <section class="session-content">
                @if (selectedPatient) {
                    <div class="row g-3 align-items-start">
                        <div class="col-12 col-xl">
                            <button type="button" class="selected-patient-card" (click)="viewPatientProfile()">
                                <img [src]="selectedPatient.profileImage" [alt]="selectedPatient.name" class="selected-patient-image">
                                <div class="selected-patient-content">
                                    <h4 class="patient-name">{{ selectedPatient.name }}</h4>
                                    <p class="patient-meta">{{ selectedPatient.gender }} - {{ selectedPatient.age }} years - {{ selectedPatient.handedness }}-Handed</p>
                                    <p class="patient-diagnosis">{{ selectedPatient.diagnosis }}</p>
                                </div>
                            </button>
                        </div>
                        <div class="col-12 col-xl-auto pt-1">
                            <div class="patient-buttons">
                                <button type="button" class="btn btn-warning" (click)="changePatient()">Change Patient</button>
                            </div>
                        </div>
                    </div>
                } @else {
                    <div class="empty-patient-state">
                        <p>No patient selected...</p>
                        <button type="button" class="btn btn-primary" routerLink="/patient-selector">Patient List</button>
                    </div>
                }

                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center gap-2 flex-wrap">
                        <h5 class="mb-0">Task Parameters</h5>
                        <div class="d-flex gap-2 ms-auto">
                            <button type="button" class="btn btn-outline-secondary">Load Default Parameters</button>
                            <button type="button" class="btn btn-primary">Save as New Default</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="taskTime" class="form-label">Time</label>
                                <input id="taskTime" type="number" min="0" class="form-control" placeholder="Enter time (seconds)">
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="taskScore" class="form-label">Score</label>
                                <input id="taskScore" type="number" min="0" class="form-control" placeholder="Enter target score">
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="audioCues">
                                    <label class="form-check-label" for="audioCues">Audio Cues</label>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="visualCues">
                                    <label class="form-check-label" for="visualCues">Visual Cues</label>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="hapticFeedback">
                                    <label class="form-check-label" for="hapticFeedback">Haptic Feedback</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="d-flex justify-content-center mt-4">
                <button type="button" class="btn btn-success btn-lg" [disabled]="!selectedMiniGame || !selectedPatient" routerLink="/therapy-session">Begin Session</button>
            </div>
        </div>
    </div>
</div>
