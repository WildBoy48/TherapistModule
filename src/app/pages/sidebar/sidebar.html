<div class="navbar navbar-expand-lg navbar-light bg-light p-3">
  <h3 class="navbar-brand pt-2 mb-0">Therapist Module</h3>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="session-config" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Session Config</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="mini-game-selector" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Mini-Game Selector</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="patient-selector" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Patient Selector</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [class.disabled]="!isPatientSelected" routerLink="patient-profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [style.pointer-events]="isPatientSelected ? 'auto' : 'none'" [style.opacity]="isPatientSelected ? 1 : 0.5">Patient Profile</a>
      </li>
      <li class="nav-item">
        <button class="nav-link btn btn-link" (click)="logout()" style="color: #dc3545;">Logout</button>
      </li>
    </ul>
  </div>
</div>
