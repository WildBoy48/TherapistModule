<div class="navbar navbar-expand-lg navbar-light bg-light p-3">
  <h3 class="navbar-brand pt-2 mb-0">Therapist Module</h3>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="navbar-nav navbar" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="session-config" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Session Config</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="mini-game-selector" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Mini-Game Selector</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="patient-selector" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Patient Selector</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [class.disabled]="!isPatientSelected" routerLink="patient-profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [style.pointer-events]="isPatientSelected ? 'auto' : 'none'" [style.opacity]="isPatientSelected ? 1 : 0.5">Patient Profile</a>
      </li>
    </ul>

    <div class="status-panel mt-4 px-3 py-3 border rounded bg-white">
      <h6 class="status-title mb-3">Connection Status</h6>
      <div class="status-row mb-2">
        <span [class]="serverStatusClass"></span>
        <span>{{ serverStatusLabel }}</span>
      </div>
      <div class="status-row">
        <span [class]="unityStatusClass"></span>
        <span>{{ unityStatusLabel }}</span>
      </div>
    </div>

    <label class="mt-2">Server IP Address</label>
    <input type="text" [(ngModel)]="serverIp" [placeholder]="serverIp"/>
    <button (click)="updateIp()" class="btn btn-primary mt-1">
      Update Server IP
    </button>

    <button class="btn btn-link logout-btn d-flex" (click)="logout()">Logout</button>
  </div>
</div>
