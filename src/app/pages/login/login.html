<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">{{ isRegistering ? 'Create Account' : 'Login' }}</h1>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="email?.invalid && (email?.dirty || email?.touched)"
          placeholder="Enter your email"
        />
        <div class="invalid-feedback" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
          <small *ngIf="email?.hasError('required')">Email is required</small>
          <small *ngIf="email?.hasError('email')">Invalid email format</small>
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="password?.invalid && (password?.dirty || password?.touched)"
          placeholder="Enter your password"
        />
        <div class="invalid-feedback" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
          <small *ngIf="password?.hasError('required')">Password is required</small>
          <small *ngIf="password?.hasError('minlength')">Password must be at least 6 characters</small>
        </div>
      </div>

      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="errorMessage && !isRegistering">
        {{ errorMessage }}
      </div>
      
      <div class="alert alert-success" *ngIf="errorMessage && isRegistering">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary w-100 mb-3"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">
          {{ isRegistering ? 'Create Account' : 'Login' }}
        </span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Loading...
        </span>
      </button>
    </form>

    <!-- Toggle Mode Link -->
    <div class="text-center">
      <button
        type="button"
        class="btn btn-link"
        (click)="toggleMode()"
        [disabled]="isLoading"
      >
        {{ isRegistering ? 'Already have an account? Login' : "Don't have an account? Register" }}
      </button>
    </div>
  </div>
</div>
