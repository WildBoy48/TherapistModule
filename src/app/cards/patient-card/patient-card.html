@if (isSelectable) {
  <div class="card-wrapper selectable" (click)="selectPatient()" style="cursor: pointer;">
    <div class="card" style="width: 18rem;">
      <img [src]="patient.profileImage" class="card-img-top" [alt]="patient.name">
      <div class="card-body">
        <h5 class="card-title">{{ patient.name }}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{ patient.gender }} - {{ patient.age }} anos - {{ patient.handedness }}</h6>
        <p class="card-text">{{ patient.diagnosis }}</p>
        <button type="button" class="btn btn-primary" (click)="goToProfile($event)">Profile</button>
      </div>
    </div>
  </div>
} @else {
  <div class="card-wrapper">
    <div class="card">
      <img [src]="patient.profileImage" class="card-img-top" [alt]="patient.name">
      <div class="card-body">
        <h5 class="card-title">{{ patient.name }}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{ patient.gender }} - {{ patient.age }} anos - {{ patient.handedness }}</h6>
        <p class="card-text">{{ patient.diagnosis }}</p>
      </div>
    </div>
  </div>
}
